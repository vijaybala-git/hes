<svg width="260" height="78" viewBox="0 0 520 155" xmlns="http://www.w3.org/2000/svg">
  <title>Electrification Collaboration</title>

  <!-- ══ SUN RAYS — gold/amber (left side) ══ -->
  <g transform="translate(78,78)">
    <polygon points="0,-58 -8,-42 8,-42"      fill="#EC9B1E"/>
    <polygon points="-41,-41 -28,-22 -18,-32"  fill="#EC9B1E"/>
    <polygon points="-58,0 -42,-8 -42,8"       fill="#EC9B1E"/>
    <polygon points="-41,41 -18,32 -28,22"     fill="#EC9B1E"/>
    <polygon points="0,58 8,42 -8,42"           fill="#EC9B1E"/>
    <polygon points="-22,-52 -12,-34 -2,-44"   fill="#EC9B1E"/>
    <polygon points="-52,-22 -34,-12 -44,-2"   fill="#EC9B1E"/>
    <polygon points="-52,22 -44,2 -34,12"      fill="#EC9B1E"/>
    <polygon points="-22,52 -2,44 -12,34"      fill="#EC9B1E"/>
    <!-- Gold dots -->
    <circle cx="-62" cy="-18" r="3.5" fill="#EC9B1E"/>
    <circle cx="-65" cy="5"   r="2.5" fill="#EC9B1E"/>
    <circle cx="-58" cy="26"  r="3"   fill="#EC9B1E"/>
    <circle cx="-38" cy="52"  r="2.5" fill="#EC9B1E"/>
    <circle cx="-18" cy="62"  r="3"   fill="#EC9B1E"/>
    <circle cx="-14" cy="-64" r="2.5" fill="#EC9B1E"/>
    <circle cx="-36" cy="-56" r="2"   fill="#EC9B1E"/>
  </g>

  <!-- ══ WATER/WIND RAYS — sky blue (right side) ══ -->
  <g transform="translate(78,78)">
    <polygon points="0,-58 8,-42 18,-52"       fill="#50BDF8"/>
    <polygon points="41,-41 28,-22 38,-12"     fill="#50BDF8"/>
    <polygon points="58,0 42,-8 42,8"          fill="#50BDF8"/>
    <polygon points="41,41 38,12 28,22"        fill="#50BDF8"/>
    <polygon points="0,58 -8,42 18,52"         fill="#50BDF8"/>
    <polygon points="52,-22 44,-2 34,-12"      fill="#50BDF8"/>
    <polygon points="52,22 34,12 44,2"         fill="#50BDF8"/>
    <polygon points="22,-52 12,-34 2,-44"      fill="#50BDF8"/>
    <polygon points="22,52 2,44 12,34"         fill="#50BDF8"/>
    <!-- Sky blue dots and drops -->
    <circle cx="62"  cy="-18" r="3.5" fill="#50BDF8"/>
    <circle cx="65"  cy="6"   r="2.5" fill="#50BDF8"/>
    <circle cx="58"  cy="26"  r="3"   fill="#50BDF8"/>
    <circle cx="36"  cy="56"  r="2.5" fill="#50BDF8"/>
    <circle cx="14"  cy="64"  r="3"   fill="#50BDF8"/>
    <ellipse cx="68" cy="-6"  rx="3" ry="5" fill="#50BDF8" transform="rotate(-20 68 -6)"/>
    <ellipse cx="66" cy="18"  rx="3" ry="5" fill="#50BDF8" transform="rotate(15 66 18)"/>
    <ellipse cx="46" cy="52"  rx="2.5" ry="4" fill="#50BDF8" transform="rotate(40 46 52)"/>
  </g>

  <!-- ══ MAIN CIRCLE — split red/navy ══ -->
  <g transform="translate(78,78)">
    <path d="M0,-45 A45,45 0 0,0 0,45 Z" fill="#D0302D"/>
    <path d="M0,-45 A45,45 0 0,1 0,45 Z" fill="#005CA2"/>
  </g>

  <!-- ══ SOLAR PANELS — red left half ══ -->
  <g transform="translate(78,78)" opacity="0.92">
    <g transform="rotate(-30) translate(-30,-20)">
      <rect x="0" y="0" width="22" height="15" rx="1" fill="#C0281F"/>
      <line x1="7"  y1="0"  x2="7"  y2="15" stroke="white" stroke-width="0.7" opacity="0.6"/>
      <line x1="14" y1="0"  x2="14" y2="15" stroke="white" stroke-width="0.7" opacity="0.6"/>
      <line x1="0"  y1="5"  x2="22" y2="5"  stroke="white" stroke-width="0.7" opacity="0.6"/>
      <line x1="0"  y1="10" x2="22" y2="10" stroke="white" stroke-width="0.7" opacity="0.6"/>
      <rect x="0" y="0" width="22" height="15" rx="1" fill="none" stroke="white" stroke-width="0.8" opacity="0.5"/>
    </g>
    <g transform="rotate(-10) translate(-28,10)">
      <rect x="0" y="0" width="22" height="15" rx="1" fill="#C0281F"/>
      <line x1="7"  y1="0"  x2="7"  y2="15" stroke="white" stroke-width="0.7" opacity="0.6"/>
      <line x1="14" y1="0"  x2="14" y2="15" stroke="white" stroke-width="0.7" opacity="0.6"/>
      <line x1="0"  y1="5"  x2="22" y2="5"  stroke="white" stroke-width="0.7" opacity="0.6"/>
      <line x1="0"  y1="10" x2="22" y2="10" stroke="white" stroke-width="0.7" opacity="0.6"/>
      <rect x="0" y="0" width="22" height="15" rx="1" fill="none" stroke="white" stroke-width="0.8" opacity="0.5"/>
    </g>
  </g>

  <!-- ══ WIND TURBINES — navy right half ══ -->
  <g transform="translate(78,78)" fill="white" opacity="0.9">
    <g transform="translate(20,-5)">
      <rect x="-1" y="0" width="2" height="32" fill="white"/>
      <polygon points="0,0 -8,-20 -2,-18" fill="white"/>
      <polygon points="0,0 10,-14 8,-6"   fill="white"/>
      <polygon points="0,0 -10,8 -4,2"    fill="white" opacity="0.7"/>
      <circle cx="0" cy="0" r="2.5" fill="white"/>
    </g>
    <g transform="translate(34,-18) scale(0.65)">
      <rect x="-1" y="0" width="2" height="28" fill="white"/>
      <polygon points="0,0 -7,-18 -2,-16" fill="white"/>
      <polygon points="0,0 9,-12 7,-5"    fill="white"/>
      <polygon points="0,0 -9,7 -4,2"     fill="white" opacity="0.7"/>
      <circle cx="0" cy="0" r="2.5" fill="white"/>
    </g>
    <g transform="translate(38,8) scale(0.5)">
      <rect x="-1" y="0" width="2" height="24" fill="white"/>
      <polygon points="0,0 -6,-16 -2,-14" fill="white"/>
      <polygon points="0,0 8,-10 6,-4"    fill="white"/>
      <polygon points="0,0 -8,6 -3,2"     fill="white" opacity="0.7"/>
      <circle cx="0" cy="0" r="2.5" fill="white"/>
    </g>
  </g>

  <!-- ══ LIGHTNING BOLT — white ══ -->
  <g transform="translate(78,78)">
    <polygon points="6,-42 -8,2 4,2 -6,42 12,-4 0,-4 14,-42"
      fill="white" stroke="white" stroke-width="0.5" stroke-linejoin="round"/>
  </g>

  <!-- ══ WORDMARK ══ -->
  <text x="175" y="68"
    font-family="Arial Rounded MT Bold,Arial Black,Arial,sans-serif"
    font-size="42" font-weight="900" fill="#50BDF8" letter-spacing="-0.5">Electrification</text>
  <text x="175" y="118"
    font-family="Arial Rounded MT Bold,Arial Black,Arial,sans-serif"
    font-size="42" font-weight="900" fill="#50BDF8" letter-spacing="-0.5">Collaboration</text>

</svg>
